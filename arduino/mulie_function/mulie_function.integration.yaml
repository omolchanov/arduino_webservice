name: Display integration test
version: 1
steps:
  - wait-serial: "Display: 0"
  - wait-serial: "Mode: counter"
  - set-control:
      part-id: btnRight
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btnRight
      control: pressed
      value: 0
  - delay: 200ms
  - wait-serial: "Display: 1"
  - set-control:
      part-id: btnLeft
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: btnLeft
      control: pressed
      value: 0
  - delay: 200ms
  - wait-serial: "Display: 101"
  - set-control:
      part-id: btnLeft
      control: pressed
      value: 1
  - set-control:
      part-id: btnMiddle
      control: pressed
      value: 1
  - set-control:
      part-id: btnRight
      control: pressed
      value: 1
  - delay: 600ms
  - set-control:
      part-id: btnLeft
      control: pressed
      value: 0
  - set-control:
      part-id: btnMiddle
      control: pressed
      value: 0
  - set-control:
      part-id: btnRight
      control: pressed
      value: 0
  - delay: 200ms
  - wait-serial: "Display: 0"
