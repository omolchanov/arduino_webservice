name: DEMUX integration test
version: 1
steps:
  - wait-serial: "DEMUX 1-to-2"
  - delay: 2500ms
  - wait-serial: "A=1  DI=1  ->  Y0=0  Y1=1"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - delay: 2500ms
  - wait-serial: "A=0  DI=1  ->  Y0=1  Y1=0  (selected: Y0)"
  - set-control:
      part-id: btnDI
      control: pressed
      value: 1
  - delay: 2500ms
  - wait-serial: "A=0  DI=0  ->  Y0=0  Y1=0  (selected: Y0)"
  - set-control:
      part-id: btnDI
      control: pressed
      value: 0
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - delay: 2500ms
  - wait-serial: "A=1  DI=1  ->  Y0=0  Y1=1  (selected: Y1)"
  - set-control:
      part-id: btnDI
      control: pressed
      value: 1
  - delay: 2500ms
  - wait-serial: "A=1  DI=0  ->  Y0=0  Y1=0  (selected: Y1)"
  - set-control:
      part-id: btnDI
      control: pressed
      value: 0
  - delay: 2500ms
  - wait-serial: "A=1  DI=1  ->  Y0=0  Y1=1  (selected: Y1)"
