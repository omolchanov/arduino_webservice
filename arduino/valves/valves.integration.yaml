name: Valves integration test
version: 1
steps:
  - wait-serial: "По умолчанию выбран AND"
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 0 | Gate = AND"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 0 | Y = 0 | Gate = AND"
  - set-control:
      part-id: btnB
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 1 | Y = 1 | Gate = AND"
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - set-control:
      part-id: btnB
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 0 | Gate = AND"
  - write-serial: "OR\n"
  - wait-serial: "Выбран вентиль: OR"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 0 | Y = 1 | Gate = OR"
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 0 | Gate = OR"
  - write-serial: "NOT\n"
  - wait-serial: "Выбран вентиль: NOT"
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NOT"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 0 | Y = 0 | Gate = NOT"
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NOT"
  - write-serial: "NAND\n"
  - wait-serial: "Выбран вентиль: NAND"
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NAND"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - set-control:
      part-id: btnB
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 1 | Y = 0 | Gate = NAND"
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - set-control:
      part-id: btnB
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NAND"
  - write-serial: "NOR\n"
  - wait-serial: "Выбран вентиль: NOR"
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NOR"
  - set-control:
      part-id: btnB
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 1 | Y = 0 | Gate = NOR"
  - set-control:
      part-id: btnB
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = NOR"
  - write-serial: "XOR\n"
  - wait-serial: "Выбран вентиль: XOR"
  - set-control:
      part-id: btnB
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 1 | Y = 1 | Gate = XOR"
  - set-control:
      part-id: btnA
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 1 | B = 1 | Y = 0 | Gate = XOR"
  - set-control:
      part-id: btnA
      control: pressed
      value: 0
  - set-control:
      part-id: btnB
      control: pressed
      value: 0
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 0 | Gate = XOR"
  - write-serial: "XNOR\n"
  - wait-serial: "Выбран вентиль: XNOR"
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 0 | Y = 1 | Gate = XNOR"
  - set-control:
      part-id: btnB
      control: pressed
      value: 1
  - delay: 1200ms
  - wait-serial: "A = 0 | B = 1 | Y = 0 | Gate = XNOR"
