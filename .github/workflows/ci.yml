name: CI

on:
  push:
    branches:
      - "feature-*"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run display dashboard Python tests
        run: python -m pytest pytest/test_display.py -v

      - name: Run MUX/DEMUX Python tests
        run: python -m pytest pytest/test_mux_demux.py -v

      - name: Run other Python API tests
        run: python -m pytest pytest/ --ignore=arduino-tests --ignore=arduino --ignore=scripts --ignore=pytest/test_display.py --ignore=pytest/test_mux_demux.py -v

  arduino-unit-tests:
    name: Arduino unit tests
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup EpoxyDuino and AUnit
        run: |
          cd ..
          git clone --depth 1 https://github.com/bxparks/AUnit
          git clone --depth 1 https://github.com/bxparks/EpoxyDuino

      - name: Run display counter AUnit tests
        run: |
          make -C arduino-tests/test_mulie_function
          make -C arduino-tests/test_mulie_function run

      - name: Run mux AUnit tests
        run: |
          make -C arduino-tests/test_mux
          make -C arduino-tests/test_mux run

      - name: Run demux AUnit tests
        run: |
          make -C arduino-tests/test_demux
          make -C arduino-tests/test_demux run

      - name: Run sensors AUnit tests
        run: |
          make -C arduino-tests/test_sensors
          make -C arduino-tests/test_sensors run

      - name: Run digital signal AUnit tests
        run: |
          make -C arduino-tests/test_simple01
          make -C arduino-tests/test_simple01 run

  arduino-integration-tests-wokwi:
    name: Arduino integration tests (Wokwi)
    needs: arduino-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install Wokwi CLI
        run: curl -L https://wokwi.com/ci/install.sh | sh

      - name: Run Wokwi integration tests (demux)
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
          WOKWI_SKETCH: demux
        run: |
          export PATH="$HOME/.wokwi/bin:$PATH"
          bash scripts/wokwi_integration_test.sh

      - name: Upload Wokwi serial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-integration-reports-demux
          path: arduino/demux/wokwi-report.log
          if-no-files-found: ignore
