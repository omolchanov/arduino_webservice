name: CI

on:
  push:
    branches:
      - "feature-*"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python API tests
        run: python -m pytest pytest/ --ignore=arduino-tests --ignore=arduino --ignore=scripts

  arduino-unit-tests:
    name: Arduino unit tests
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup EpoxyDuino and AUnit
        run: |
          cd ..
          git clone --depth 1 https://github.com/bxparks/AUnit
          git clone --depth 1 https://github.com/bxparks/EpoxyDuino

      - name: Run AUnit unit tests (native)
        run: make -C arduino-tests runtests
