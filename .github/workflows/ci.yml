name: CI

on:
  push:
    branches:
      - "feature-*"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run display dashboard Python tests
        run: python -m pytest pytest/test_display.py -v

      - name: Run other Python API tests
        run: python -m pytest pytest/ --ignore=arduino-tests --ignore=arduino --ignore=scripts --ignore=pytest/test_display.py -v

  arduino-unit-tests:
    name: Arduino unit tests
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup EpoxyDuino and AUnit
        run: |
          cd ..
          git clone --depth 1 https://github.com/bxparks/AUnit
          git clone --depth 1 https://github.com/bxparks/EpoxyDuino

      - name: Run display counter AUnit tests
        run: |
          make -C arduino-tests/test_mulie_function
          make -C arduino-tests/test_mulie_function run

      - name: Run valves AUnit tests
        run: |
          make -C arduino-tests/test_valves
          make -C arduino-tests/test_valves run

      - name: Run sensors AUnit tests
        run: |
          make -C arduino-tests/test_sensors
          make -C arduino-tests/test_sensors run

      - name: Run digital signal AUnit tests
        run: |
          make -C arduino-tests/test_simple01
          make -C arduino-tests/test_simple01 run

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Compile mulie_function production sketch
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile -b arduino:avr:uno arduino/mulie_function \
            --build-property "compiler.cpp.extra_flags=-Iarduino"
