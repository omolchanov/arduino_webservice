name: CI

on:
  push:
    branches:
      - "feature-*"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python API tests
        run: python -m pytest pytest/ --ignore=arduino-tests --ignore=arduino --ignore=scripts

  arduino-unit-tests:
    name: Arduino unit tests
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup EpoxyDuino and AUnit
        run: |
          cd ..
          git clone --depth 1 https://github.com/bxparks/AUnit
          git clone --depth 1 https://github.com/bxparks/EpoxyDuino

      - name: Run AUnit unit tests (native)
        run: make -C arduino-tests runtests

  arduino-integration-tests:
    name: Arduino integration tests
    needs: arduino-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install Wokwi CLI
        run: curl -L https://wokwi.com/ci/install.sh | sh

      - name: Run Wokwi integration tests
        id: wokwi_tests
        continue-on-error: true
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          export PATH="$HOME/.wokwi/bin:$PATH"
          bash scripts/wokwi_integration_test.sh

      - name: Publish Wokwi HTML report
        if: always()
        run: python scripts/format_wokwi_integration_report.py --github-summary

      - name: Upload Wokwi HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-integration-report
          path: arduino/wokwi-integration-report.html
          if-no-files-found: ignore

      - name: Fail job if integration tests failed
        if: steps.wokwi_tests.outcome == 'failure'
        run: exit 1
