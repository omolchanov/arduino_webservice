<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Digital Signal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #fbbf24;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow: auto;
    }

    .page-title-row {
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .page-title {
      float: left;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 0;
    }

    .btn-clear {
      float: right;
      font-size: 0.75rem;
      font-weight: 600;
      color: #b0b0b0;
      background: #252528;
      border: 1px solid #3a3a42;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-clear:hover {
      color: #fff;
      border-color: #4a4a55;
      background: #2a2a30;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .value-widgets-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
    }

    .value-widgets-row .card {
      min-width: 0;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .card-wide {
      grid-column: 1 / -1;
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .sensor-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 0.4rem;
      vertical-align: middle;
      border-radius: 50%;
      background: #888;
    }

    .sensor-status-dot.ok { background: #4ade80; }
    .sensor-status-dot.error { background: #f87171; }

    .card-body {
      padding: 1.25rem 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-body-value {
      justify-content: center;
      align-items: center;
    }

    .distance-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #60a5fa;
    }

    .distance-unit {
      font-size: 1rem;
      color: #888;
      margin-top: 0.5rem;
    }

    .detected-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #a78bfa;
    }

    .current-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #34d399;
    }

    .resistance-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #f97316;
    }

    .logic-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #fbbf24;
    }

    .chart-wrap {
      position: relative;
      height: 220px;
      width: 100%;
    }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/">Keypad</a>
        <a href="/sensors">Sensors</a>
        <a href="/digital" class="active">Digital Signal</a>
        <a href="/valves">Valves</a>
        <a href="/display">Display</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
        <div class="page-title-row">
          <h1 class="page-title">Digital Signal</h1>
          <button type="button" id="clearGraphBtn" class="btn-clear">Clear</button>
        </div>

        <div class="dashboard">
          <div class="value-widgets-row">
          <div class="card">
            <div class="card-header">
              Potentiometer <span id="potDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="potValue" class="distance-value">—</div>
              <div class="distance-unit">V</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              Detected logic LED <span id="detectedDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="detectedValue" class="detected-value">—</div>
              <div class="distance-unit">detected</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              Current <span id="currentDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="currentValue" class="current-value">—</div>
              <div class="distance-unit">mA</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              Resistance <span id="resistanceDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="resistanceValue" class="resistance-value">—</div>
              <div class="distance-unit">Ω</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              Logic signal LED <span id="logicSignalDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="logicSignalValue" class="logic-value">—</div>
              <div class="distance-unit">signal</div>
            </div>
          </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Potentiometer history, V</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="potChart"></canvas>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Shunt resistor history, mA</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="currentChart"></canvas>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Resistance history, Ω</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="resistanceChart"></canvas>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Detected logic LED history</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="detectedChart"></canvas>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Logic signal LED history</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="logicChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const WINDOW_SEC = 120;
    const LOGIC_STORAGE_KEY = "digital-logic-led-history";
    const POT_STORAGE_KEY = "digital-pot-history";
    const DETECTED_STORAGE_KEY = "digital-detected-history";
    const CURRENT_STORAGE_KEY = "digital-current-history";
    const RESISTANCE_STORAGE_KEY = "digital-resistance-history";
    const POT_ZONE_LOW_V = 1.5;
    const POT_ZONE_HIGH_V = 3.0;
    const SENSOR_PENDING_MS = 10000;

    const logicSignalValueEl = document.getElementById("logicSignalValue");
    const potValueEl = document.getElementById("potValue");
    const detectedValueEl = document.getElementById("detectedValue");
    const currentValueEl = document.getElementById("currentValue");
    const resistanceValueEl = document.getElementById("resistanceValue");
    const statusEl = document.getElementById("status");
    const notificationEl = document.getElementById("notification");

    const widgets = {
      pot: {
        dotState: "initializing",
        dotEl: document.getElementById("potDot"),
        initTimeoutId: null,
      },
      detected: {
        dotState: "initializing",
        dotEl: document.getElementById("detectedDot"),
        initTimeoutId: null,
      },
      current: {
        dotState: "initializing",
        dotEl: document.getElementById("currentDot"),
        initTimeoutId: null,
      },
      resistance: {
        dotState: "initializing",
        dotEl: document.getElementById("resistanceDot"),
        initTimeoutId: null,
      },
      logic: {
        dotState: "initializing",
        dotEl: document.getElementById("logicSignalDot"),
        initTimeoutId: null,
      },
    };

    function loadHistory(storageKey, validatePoint) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return [];
        const data = JSON.parse(raw);
        if (!Array.isArray(data.points)) return [];
        const cutoff = Date.now() - WINDOW_SEC * 1000;
        return data.points.filter((p) => p.ts && p.ts >= cutoff && validatePoint(p));
      } catch {
        return [];
      }
    }

    function pruneHistory(history) {
      const cutoff = Date.now() - WINDOW_SEC * 1000;
      while (history.length && history[0].ts < cutoff) {
        history.shift();
      }
    }

    function saveHistory(storageKey, history) {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ points: history }));
      } catch {
        showNotification("Could not save graph history");
      }
    }

    const logicHistory = loadHistory(
      LOGIC_STORAGE_KEY,
      (p) => p.v === 0 || p.v === 1
    );
    const potHistory = loadHistory(
      POT_STORAGE_KEY,
      (p) => typeof p.v === "number" && p.v >= 0 && p.v <= 5
    );
    const detectedHistory = loadHistory(
      DETECTED_STORAGE_KEY,
      (p) => p.v === 0 || p.v === 0.5 || p.v === 1
    ).map((p) => ({ ...p, v: p.v === 0.5 ? 0 : p.v }));
    const currentHistory = loadHistory(
      CURRENT_STORAGE_KEY,
      (p) => typeof p.v === "number" && p.v >= 0 && p.v <= 500
    );
    const resistanceHistory = loadHistory(
      RESISTANCE_STORAGE_KEY,
      (p) => typeof p.v === "number" && p.v >= 0 && p.v <= 50
    );
    let ws = null;
    let reconnectTimer = null;
    let arduinoOnline = false;
    let serialStatusKnown = false;
    let lastDetectedValue = detectedHistory.length
      ? detectedHistory[detectedHistory.length - 1].v
      : null;

    function showNotification(message, type = "error") {
      notificationEl.textContent = message;
      notificationEl.className = `notification show ${type}`;
      setTimeout(() => notificationEl.classList.remove("show"), 3000);
    }

    function setWidgetDot(widgetId, state) {
      widgets[widgetId].dotState = state;
      widgets[widgetId].dotEl.className = `sensor-status-dot ${state}`;
    }

    function clearWidgetInitTimeout(widgetId) {
      const widget = widgets[widgetId];
      if (widget.initTimeoutId) {
        clearTimeout(widget.initTimeoutId);
        widget.initTimeoutId = null;
      }
    }

    function clearWidgetTimers(widgetId) {
      clearWidgetInitTimeout(widgetId);
    }

    function startWidgetInitTimeouts() {
      for (const [id, widget] of Object.entries(widgets)) {
        if (widget.dotState !== "initializing") continue;
        clearWidgetInitTimeout(id);
        widget.initTimeoutId = setTimeout(() => {
          if (arduinoOnline && widget.dotState === "initializing") {
            setWidgetDot(id, "error");
          }
        }, SENSOR_PENDING_MS);
      }
    }

    function applyWidgetReading(widgetId, live) {
      if (!arduinoOnline || !live) return;
      clearWidgetInitTimeout(widgetId);
      setWidgetDot(widgetId, "ok");
    }

    function onWidgetsOffline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetTimers(id);
        setWidgetDot(id, "error");
      }
    }

    function onWidgetsOnline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetTimers(id);
        setWidgetDot(id, "initializing");
      }
      startWidgetInitTimeouts();
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
      if (connected === arduinoOnline) return;
      arduinoOnline = connected;
      if (connected) {
        onWidgetsOnline();
      } else {
        onWidgetsOffline();
      }
    }

    function setLogic(value) {
      logicSignalValueEl.textContent = String(value);
    }

    function setPotentiometer(v) {
      potValueEl.textContent = Number(v).toFixed(2);
    }

    function setDetected(value) {
      detectedValueEl.textContent = String(Number(value) === 0.5 ? 0 : Number(value));
    }

    function setCurrent(ma) {
      currentValueEl.textContent = Number(ma).toFixed(1);
    }

    function setResistance(ohm) {
      resistanceValueEl.textContent = Number(ohm).toFixed(1);
    }

    function createLineChart(canvasId, label, borderColor, backgroundColor, yScale) {
      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label,
            parsing: false,
            data: [],
            borderColor,
            backgroundColor,
            stepped: yScale.stepped ?? false,
            fill: true,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: "linear",
              min: 0,
              max: WINDOW_SEC,
              title: { display: true, text: "Seconds", color: "#888" },
              ticks: { color: "#888" },
              grid: { color: "#3a3a42" },
            },
            y: {
              min: yScale.min,
              max: yScale.max,
              title: yScale.title
                ? { display: true, text: yScale.title, color: "#888" }
                : undefined,
              ticks: {
                stepSize: yScale.stepSize,
                color: "#888",
                callback: yScale.tickCallback ?? ((v) => String(v)),
              },
              grid: { color: "#3a3a42" },
            },
          },
          plugins: {
            legend: { display: false },
          },
        },
      });
    }

    const logicChart = createLineChart(
      "logicChart",
      "Logic signal LED",
      "#fbbf24",
      "rgba(251, 191, 36, 0.1)",
      { min: 0, max: 1, stepSize: 1, stepped: true }
    );

    const potChart = createLineChart(
      "potChart",
      "Potentiometer history, V",
      "#60a5fa",
      "rgba(96, 165, 250, 0.1)",
      { min: 0, max: 5, stepSize: 1, title: "V" }
    );
    potChart.data.datasets[0].order = 1;
    potChart.data.datasets[0].fill = false;
    potChart.data.datasets.push({
      label: `${POT_ZONE_LOW_V} V`,
      parsing: false,
      data: [
        { x: 0, y: POT_ZONE_LOW_V },
        { x: WINDOW_SEC, y: POT_ZONE_LOW_V },
      ],
      borderColor: "#4ade80",
      borderWidth: 1,
      borderDash: [6, 4],
      pointRadius: 0,
      fill: false,
      order: 0,
    });
    potChart.data.datasets.push({
      label: `${POT_ZONE_HIGH_V} V`,
      parsing: false,
      data: [
        { x: 0, y: POT_ZONE_HIGH_V },
        { x: WINDOW_SEC, y: POT_ZONE_HIGH_V },
      ],
      borderColor: "#f87171",
      borderWidth: 1,
      borderDash: [6, 4],
      pointRadius: 0,
      fill: false,
      order: 0,
    });

    const detectedChart = createLineChart(
      "detectedChart",
      "Detected logic LED",
      "#a78bfa",
      "rgba(167, 139, 250, 0.1)",
      { min: 0, max: 1, stepSize: 1, stepped: true }
    );

    const currentChart = createLineChart(
      "currentChart",
      "Shunt resistor history, mA",
      "#34d399",
      "rgba(52, 211, 153, 0.1)",
      { min: 0, max: 500, stepSize: 100, title: "mA" }
    );

    const resistanceChart = createLineChart(
      "resistanceChart",
      "Resistance history, Ω",
      "#f97316",
      "rgba(249, 115, 22, 0.1)",
      { min: 0, max: 50, stepSize: 10, title: "Ω" }
    );

    function renderSeriesChart(chart, history) {
      pruneHistory(history);
      const now = Date.now();
      const windowStart = now - WINDOW_SEC * 1000;

      if (!history.length) {
        chart.data.datasets[0].data = [];
        chart.update();
        return;
      }

      chart.data.datasets[0].data = history.map((p) => ({
        x: (p.ts - windowStart) / 1000,
        y: p.v,
      }));
      chart.update();
    }

    function renderPotChart() {
      pruneHistory(potHistory);
      const now = Date.now();
      const windowStart = now - WINDOW_SEC * 1000;

      potChart.data.datasets[0].data = potHistory.map((p) => ({
        x: (p.ts - windowStart) / 1000,
        y: p.v,
      }));
      potChart.update();
    }

    function appendHistoryPoint(history, storageKey, chart, value) {
      history.push({ ts: Date.now(), v: value });
      pruneHistory(history);
      saveHistory(storageKey, history);
      renderSeriesChart(chart, history);
    }

    function appendPotPoint(value) {
      potHistory.push({ ts: Date.now(), v: value });
      pruneHistory(potHistory);
      saveHistory(POT_STORAGE_KEY, potHistory);
      renderPotChart();
    }

    function clearSeries(history, storageKey, chart) {
      history.length = 0;
      localStorage.removeItem(storageKey);
      if (chart === potChart) {
        renderPotChart();
      } else {
        renderSeriesChart(chart, history);
      }
    }

    function handleLogic(value, live) {
      setLogic(value);
      appendHistoryPoint(logicHistory, LOGIC_STORAGE_KEY, logicChart, value);
      applyWidgetReading("logic", live);
    }

    function handlePotentiometer(v, live) {
      const value = Number(v);
      setPotentiometer(value);
      appendPotPoint(value);
      applyWidgetReading("pot", live);
    }

    function handleDetected(value, live) {
      const v = Number(value) === 0.5 ? 0 : Number(value);
      setDetected(v);
      lastDetectedValue = v;
      appendHistoryPoint(detectedHistory, DETECTED_STORAGE_KEY, detectedChart, v);
      applyWidgetReading("detected", live);
    }

    function handleCurrent(ma, live) {
      const value = Number(ma);
      setCurrent(value);
      appendHistoryPoint(currentHistory, CURRENT_STORAGE_KEY, currentChart, value);
      applyWidgetReading("current", live);
    }

    function handleResistance(ohm, live) {
      const value = Number(ohm);
      setResistance(value);
      appendHistoryPoint(
        resistanceHistory,
        RESISTANCE_STORAGE_KEY,
        resistanceChart,
        value
      );
      applyWidgetReading("resistance", live);
    }

    function clearGraph() {
      clearSeries(logicHistory, LOGIC_STORAGE_KEY, logicChart);
      clearSeries(potHistory, POT_STORAGE_KEY, potChart);
      lastDetectedValue = null;
      clearSeries(detectedHistory, DETECTED_STORAGE_KEY, detectedChart);
      clearSeries(currentHistory, CURRENT_STORAGE_KEY, currentChart);
      clearSeries(resistanceHistory, RESISTANCE_STORAGE_KEY, resistanceChart);
      showNotification("Graphs cleared", "success");
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.serial_connected);
        if (data.last_logic_value != null && logicSignalValueEl.textContent === "—") {
          handleLogic(data.last_logic_value, false);
        }
        if (data.last_potentiometer_v != null && potValueEl.textContent === "—") {
          setPotentiometer(data.last_potentiometer_v);
        }
        if (data.last_detected_value != null && detectedValueEl.textContent === "—") {
          handleDetected(data.last_detected_value, false);
        }
        if (data.last_current_ma != null && currentValueEl.textContent === "—") {
          setCurrent(data.last_current_ma);
        }
        if (
          data.last_led_resistance_ohm != null
          && resistanceValueEl.textContent === "—"
        ) {
          setResistance(data.last_led_resistance_ohm);
        }
      } catch {
        setStatus(false);
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "serial_status") {
            const wasOnline = arduinoOnline;
            setStatus(data.connected);
            if (serialStatusKnown && data.connected && !wasOnline) {
              showNotification("Arduino reconnected", "success");
            }
            serialStatusKnown = true;
            return;
          }
          if (data.type === "logic" && data.value != null) {
            handleLogic(Number(data.value), !data.cached);
          }
          if (data.type === "potentiometer" && data.v != null) {
            handlePotentiometer(data.v, !data.cached);
          }
          if (data.type === "detected" && data.value != null) {
            handleDetected(Number(data.value), !data.cached);
          }
          if (data.type === "current" && data.ma != null) {
            handleCurrent(data.ma, !data.cached);
          }
          if (data.type === "resistance" && data.ohm != null) {
            handleResistance(data.ohm, !data.cached);
          }
        } catch {
          showNotification("Invalid message from server");
        }
      };

      ws.onclose = () => {
        setStatus(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
        showNotification("Connection error");
      };
    }

    connect();
    pollStatus();
    setInterval(pollStatus, 3000);

    document.getElementById("clearGraphBtn").addEventListener("click", clearGraph);

    if (logicHistory.length) {
      const last = logicHistory[logicHistory.length - 1];
      setLogic(last.v);
      renderSeriesChart(logicChart, logicHistory);
    }
    if (potHistory.length) {
      const last = potHistory[potHistory.length - 1];
      setPotentiometer(last.v);
      renderPotChart();
    }
    if (detectedHistory.length) {
      const last = detectedHistory[detectedHistory.length - 1];
      setDetected(last.v);
      renderSeriesChart(detectedChart, detectedHistory);
    }
    if (currentHistory.length) {
      const last = currentHistory[currentHistory.length - 1];
      setCurrent(last.v);
      renderSeriesChart(currentChart, currentHistory);
    }
    if (resistanceHistory.length) {
      const last = resistanceHistory[resistanceHistory.length - 1];
      setResistance(last.v);
      renderSeriesChart(resistanceChart, resistanceHistory);
    }

    window.addEventListener("beforeunload", () => {
      saveHistory(LOGIC_STORAGE_KEY, logicHistory);
      saveHistory(POT_STORAGE_KEY, potHistory);
      saveHistory(DETECTED_STORAGE_KEY, detectedHistory);
      saveHistory(CURRENT_STORAGE_KEY, currentHistory);
      saveHistory(RESISTANCE_STORAGE_KEY, resistanceHistory);
    });
  </script>
</body>
</html>
