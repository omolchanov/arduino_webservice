<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Condensator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #38bdf8;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.6rem 1.5rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1rem 1.5rem;
      overflow: auto;
    }

    .page-title-row {
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .page-title {
      float: left;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 0;
    }

    .phase-badge {
      float: left;
      margin-left: 1rem;
      margin-top: 0.1rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border: 1px solid #3a3a42;
      color: #888;
      background: #252528;
    }

    .phase-badge.charging {
      color: #86efac;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .phase-badge.discharging {
      color: #fcd34d;
      border-color: #5a4a2d;
      background: #2e261a;
    }

    .btn-clear {
      float: right;
      font-size: 0.75rem;
      font-weight: 600;
      color: #b0b0b0;
      background: #252528;
      border: 1px solid #3a3a42;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-clear:hover {
      color: #fff;
      border-color: #4a4a55;
      background: #2a2a30;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.65rem;
      align-items: start;
    }

    .value-widgets-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }

    .value-widgets-row .card {
      min-width: 0;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 100px;
      display: flex;
      flex-direction: column;
    }

    .card-wide {
      grid-column: 1 / -1;
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .sensor-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 0.4rem;
      vertical-align: middle;
      border-radius: 50%;
      background: #888;
    }

    .sensor-status-dot.ok { background: #4ade80; }
    .sensor-status-dot.error { background: #f87171; }

    .card-body {
      padding: 0.75rem 0.75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-body-value {
      justify-content: center;
      align-items: center;
    }

    .voltage-value {
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1;
      color: #38bdf8;
    }

    .charge-value {
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1;
      color: #a78bfa;
    }

    .value-unit {
      font-size: 0.9rem;
      color: #888;
      margin-top: 0.25rem;
    }

    .chart-wrap {
      position: relative;
      height: 155px;
      width: 100%;
    }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/">Keypad</a>
        <a href="/sensors">Sensors</a>
        <a href="/digital">Digital Signal</a>
        <a href="/valves">Valves</a>
        <a href="/display">Display</a>
        <a href="/multiplexor">Multiplexor</a>
        <a href="/demultiplexor">Demultiplexor</a>
        <a href="/condensator" class="active">Condensator</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
        <div class="page-title-row">
          <h1 class="page-title">Condensator</h1>
          <span id="phaseBadge" class="phase-badge">—</span>
          <button type="button" id="clearGraphBtn" class="btn-clear">Clear</button>
        </div>

        <div class="dashboard">
          <div class="value-widgets-row">
            <div class="card">
              <div class="card-header">
                Voltage <span id="voltageDot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="voltageValue" class="voltage-value">—</div>
                <div class="value-unit">V</div>
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                Charge Q <span id="chargeDot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="chargeValue" class="charge-value">—</div>
                <div class="value-unit">µC</div>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Voltage history, V</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="voltageChart"></canvas>
              </div>
            </div>
          </div>
          <div class="card card-wide">
            <div class="card-header">Charge Q history, µC</div>
            <div class="card-body">
              <div class="chart-wrap">
                <canvas id="chargeChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const WINDOW_SEC = 120;
    const VOLTAGE_STORAGE_KEY = "condensator-voltage-history";
    const CHARGE_STORAGE_KEY = "condensator-charge-history";
    const PHASE_STORAGE_KEY = "condensator-phase-markers";
    const SENSOR_PENDING_MS = 10000;
    const CHARGE_ON_COLOR = "#4ade80";
    const DISCHARGE_ON_COLOR = "#fbbf24";

    const voltageValueEl = document.getElementById("voltageValue");
    const chargeValueEl = document.getElementById("chargeValue");
    const phaseBadgeEl = document.getElementById("phaseBadge");
    const statusEl = document.getElementById("status");
    const notificationEl = document.getElementById("notification");

    const widgets = {
      voltage: {
        dotState: "initializing",
        dotEl: document.getElementById("voltageDot"),
        initTimeoutId: null,
      },
      charge: {
        dotState: "initializing",
        dotEl: document.getElementById("chargeDot"),
        initTimeoutId: null,
      },
    };

    function loadHistory(storageKey, validatePoint) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return [];
        const data = JSON.parse(raw);
        if (!Array.isArray(data.points)) return [];
        const cutoff = Date.now() - WINDOW_SEC * 1000;
        return data.points.filter((p) => p.ts && p.ts >= cutoff && validatePoint(p));
      } catch {
        return [];
      }
    }

    function loadPhaseMarkers() {
      try {
        const raw = localStorage.getItem(PHASE_STORAGE_KEY);
        if (!raw) return [];
        const data = JSON.parse(raw);
        if (!Array.isArray(data.markers)) return [];
        const cutoff = Date.now() - WINDOW_SEC * 1000;
        return data.markers.filter(
          (m) => m.ts && m.ts >= cutoff && (m.phase === "charging" || m.phase === "discharging")
        );
      } catch {
        return [];
      }
    }

    function pruneHistory(history) {
      const cutoff = Date.now() - WINDOW_SEC * 1000;
      while (history.length && history[0].ts < cutoff) {
        history.shift();
      }
    }

    function prunePhaseMarkers() {
      const cutoff = Date.now() - WINDOW_SEC * 1000;
      while (phaseMarkers.length && phaseMarkers[0].ts < cutoff) {
        phaseMarkers.shift();
      }
    }

    function saveHistory(storageKey, history) {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ points: history }));
      } catch {
        showNotification("Could not save graph history");
      }
    }

    function savePhaseMarkers() {
      try {
        localStorage.setItem(PHASE_STORAGE_KEY, JSON.stringify({ markers: phaseMarkers }));
      } catch {
        showNotification("Could not save phase markers");
      }
    }

    const voltageHistory = loadHistory(
      VOLTAGE_STORAGE_KEY,
      (p) => typeof p.v === "number" && p.v >= 0 && p.v <= 5
    );
    const chargeHistory = loadHistory(
      CHARGE_STORAGE_KEY,
      (p) => typeof p.v === "number" && p.v >= 0 && p.v <= 1200
    );
    const phaseMarkers = loadPhaseMarkers();

    let ws = null;
    let reconnectTimer = null;
    let arduinoOnline = false;
    let serialStatusKnown = false;
    let lastVoltage = voltageHistory.length ? voltageHistory[voltageHistory.length - 1].v : null;
    let lastCharge = chargeHistory.length ? chargeHistory[chargeHistory.length - 1].v : null;

    function showNotification(message, type = "error") {
      notificationEl.textContent = message;
      notificationEl.className = `notification show ${type}`;
      setTimeout(() => notificationEl.classList.remove("show"), 3000);
    }

    function setWidgetDot(widgetId, state) {
      widgets[widgetId].dotState = state;
      widgets[widgetId].dotEl.className = `sensor-status-dot ${state}`;
    }

    function clearWidgetInitTimeout(widgetId) {
      const widget = widgets[widgetId];
      if (widget.initTimeoutId) {
        clearTimeout(widget.initTimeoutId);
        widget.initTimeoutId = null;
      }
    }

    function startWidgetInitTimeouts() {
      for (const [id, widget] of Object.entries(widgets)) {
        if (widget.dotState !== "initializing") continue;
        clearWidgetInitTimeout(id);
        widget.initTimeoutId = setTimeout(() => {
          if (arduinoOnline && widget.dotState === "initializing") {
            setWidgetDot(id, "error");
          }
        }, SENSOR_PENDING_MS);
      }
    }

    function applyWidgetReading(widgetId, live) {
      if (!arduinoOnline || !live) return;
      clearWidgetInitTimeout(widgetId);
      setWidgetDot(widgetId, "ok");
    }

    function onWidgetsOffline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetInitTimeout(id);
        setWidgetDot(id, "error");
      }
    }

    function onWidgetsOnline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetInitTimeout(id);
        setWidgetDot(id, "initializing");
      }
      startWidgetInitTimeouts();
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
      if (connected === arduinoOnline) return;
      arduinoOnline = connected;
      if (connected) {
        onWidgetsOnline();
      } else {
        onWidgetsOffline();
      }
    }

    function setPhase(phase) {
      if (phase === "charging") {
        phaseBadgeEl.textContent = "Charging";
        phaseBadgeEl.className = "phase-badge charging";
      } else if (phase === "discharging") {
        phaseBadgeEl.textContent = "Discharging";
        phaseBadgeEl.className = "phase-badge discharging";
      } else {
        phaseBadgeEl.textContent = "—";
        phaseBadgeEl.className = "phase-badge";
      }
    }

    function setVoltage(v) {
      voltageValueEl.textContent = Number(v).toFixed(2);
    }

    function setCharge(q) {
      chargeValueEl.textContent = Number(q).toFixed(1);
    }

    function valueAtTime(history, ts) {
      let value = null;
      for (const point of history) {
        if (point.ts <= ts) {
          value = point.v;
        }
      }
      return value;
    }

    function createLineChart(canvasId, label, borderColor, backgroundColor, yScale) {
      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label,
            parsing: false,
            data: [],
            borderColor,
            backgroundColor,
            fill: true,
            pointRadius: 0,
            borderWidth: 2,
            order: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: "linear",
              min: 0,
              max: WINDOW_SEC,
              title: { display: true, text: "Seconds", color: "#888" },
              ticks: { color: "#888" },
              grid: { color: "#3a3a42" },
            },
            y: {
              min: yScale.min,
              max: yScale.max,
              title: yScale.title
                ? { display: true, text: yScale.title, color: "#888" }
                : undefined,
              ticks: {
                stepSize: yScale.stepSize,
                color: "#888",
              },
              grid: { color: "#3a3a42" },
            },
          },
          plugins: {
            legend: {
              display: true,
              position: "bottom",
              labels: {
                color: "#888",
                boxWidth: 12,
                font: { size: 10 },
                filter: (item) => item.datasetIndex > 0,
              },
            },
          },
        },
      });
    }

    function addPhaseMarkerDatasets(chart) {
      chart.data.datasets[0].fill = false;
      chart.data.datasets.push({
        label: "Charge on",
        parsing: false,
        data: [],
        borderColor: CHARGE_ON_COLOR,
        backgroundColor: CHARGE_ON_COLOR,
        pointRadius: 6,
        pointHoverRadius: 7,
        pointStyle: "circle",
        showLine: false,
        order: 3,
      });
      chart.data.datasets.push({
        label: "Discharge on",
        parsing: false,
        data: [],
        borderColor: DISCHARGE_ON_COLOR,
        backgroundColor: DISCHARGE_ON_COLOR,
        pointRadius: 6,
        pointHoverRadius: 7,
        pointStyle: "circle",
        showLine: false,
        order: 3,
      });
    }

    const voltageChart = createLineChart(
      "voltageChart",
      "Voltage history, V",
      "#38bdf8",
      "rgba(56, 189, 248, 0.1)",
      { min: 2, max: 3, stepSize: 0.5, title: "V" }
    );
    addPhaseMarkerDatasets(voltageChart);

    const chargeChart = createLineChart(
      "chargeChart",
      "Charge Q history, µC",
      "#a78bfa",
      "rgba(167, 139, 250, 0.1)",
      { min: 500, max: 600, stepSize: 50, title: "µC" }
    );
    addPhaseMarkerDatasets(chargeChart);

    function renderPhaseMarkers(chart, getY) {
      prunePhaseMarkers();
      const now = Date.now();
      const windowStart = now - WINDOW_SEC * 1000;
      const chargeOn = [];
      const dischargeOn = [];

      for (const marker of phaseMarkers) {
        const x = (marker.ts - windowStart) / 1000;
        if (x < 0 || x > WINDOW_SEC) continue;
        const y = getY(marker);
        if (y == null) continue;
        const point = { x, y };
        if (marker.phase === "charging") {
          chargeOn.push(point);
        } else {
          dischargeOn.push(point);
        }
      }

      chart.data.datasets[1].data = chargeOn;
      chart.data.datasets[2].data = dischargeOn;
    }

    function renderChart(chart, history, getY) {
      pruneHistory(history);
      const now = Date.now();
      const windowStart = now - WINDOW_SEC * 1000;

      chart.data.datasets[0].data = history.map((p) => ({
        x: (p.ts - windowStart) / 1000,
        y: p.v,
      }));
      renderPhaseMarkers(chart, getY);
      chart.update();
    }

    function renderVoltageChart() {
      renderChart(
        voltageChart,
        voltageHistory,
        (m) => m.v ?? valueAtTime(voltageHistory, m.ts)
      );
    }

    function renderChargeChart() {
      renderChart(
        chargeChart,
        chargeHistory,
        (m) => m.q ?? valueAtTime(chargeHistory, m.ts)
      );
    }

    function appendVoltagePoint(value) {
      voltageHistory.push({ ts: Date.now(), v: value });
      pruneHistory(voltageHistory);
      saveHistory(VOLTAGE_STORAGE_KEY, voltageHistory);
      renderVoltageChart();
    }

    function appendChargePoint(value) {
      chargeHistory.push({ ts: Date.now(), v: value });
      pruneHistory(chargeHistory);
      saveHistory(CHARGE_STORAGE_KEY, chargeHistory);
      renderChargeChart();
    }

    function clearVoltageSeries() {
      voltageHistory.length = 0;
      localStorage.removeItem(VOLTAGE_STORAGE_KEY);
      renderVoltageChart();
    }

    function clearChargeSeries() {
      chargeHistory.length = 0;
      localStorage.removeItem(CHARGE_STORAGE_KEY);
      renderChargeChart();
    }

    function handleCondensator(v, qUc, live) {
      const voltage = Number(v);
      const charge = Number(qUc);
      lastVoltage = voltage;
      lastCharge = charge;
      setVoltage(voltage);
      setCharge(charge);
      appendVoltagePoint(voltage);
      appendChargePoint(charge);
      applyWidgetReading("voltage", live);
      applyWidgetReading("charge", live);
    }

    function handlePhase(phase, live) {
      setPhase(phase);
      if (!live) return;
      const ts = Date.now();
      phaseMarkers.push({
        ts,
        phase,
        v: lastVoltage,
        q: lastCharge,
      });
      prunePhaseMarkers();
      savePhaseMarkers();
      renderVoltageChart();
      renderChargeChart();
    }

    function clearGraph() {
      clearVoltageSeries();
      clearChargeSeries();
      phaseMarkers.length = 0;
      localStorage.removeItem(PHASE_STORAGE_KEY);
      showNotification("Graphs cleared", "success");
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.serial_connected);
        if (data.last_condensator_phase != null) {
          setPhase(data.last_condensator_phase);
        }
        if (
          data.last_condensator_v != null
          && voltageValueEl.textContent === "—"
        ) {
          setVoltage(data.last_condensator_v);
          lastVoltage = data.last_condensator_v;
        }
        if (
          data.last_condensator_q_uc != null
          && chargeValueEl.textContent === "—"
        ) {
          setCharge(data.last_condensator_q_uc);
          lastCharge = data.last_condensator_q_uc;
        }
      } catch {
        setStatus(false);
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "serial_status") {
            const wasOnline = arduinoOnline;
            setStatus(data.connected);
            if (serialStatusKnown && data.connected && !wasOnline) {
              showNotification("Arduino reconnected", "success");
            }
            serialStatusKnown = true;
            return;
          }
          if (data.type === "condensator_phase" && data.phase != null) {
            handlePhase(data.phase, !data.cached);
          }
          if (data.type === "condensator" && data.v != null && data.q_uc != null) {
            handleCondensator(data.v, data.q_uc, !data.cached);
          }
        } catch {
          showNotification("Invalid message from server");
        }
      };

      ws.onclose = () => {
        setStatus(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
        showNotification("Connection error");
      };
    }

    connect();
    pollStatus();
    setInterval(pollStatus, 3000);

    document.getElementById("clearGraphBtn").addEventListener("click", clearGraph);

    if (voltageHistory.length) {
      const last = voltageHistory[voltageHistory.length - 1];
      setVoltage(last.v);
      renderVoltageChart();
    }
    if (chargeHistory.length) {
      const last = chargeHistory[chargeHistory.length - 1];
      setCharge(last.v);
      renderChargeChart();
    }

    window.addEventListener("beforeunload", () => {
      saveHistory(VOLTAGE_STORAGE_KEY, voltageHistory);
      saveHistory(CHARGE_STORAGE_KEY, chargeHistory);
      savePhaseMarkers();
    });
  </script>
</body>
</html>
