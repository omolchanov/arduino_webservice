<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Sensors</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #60a5fa;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow: auto;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 1.25rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .card-body {
      padding: 1.25rem 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .distance-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #60a5fa;
    }

    .distance-unit {
      font-size: 1rem;
      color: #888;
      margin-top: 0.5rem;
    }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/">Keypad</a>
        <a href="/sensors" class="active">Sensors</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
      <h1 class="page-title">Sensors</h1>

      <div class="dashboard">
        <div class="card">
          <div class="card-header">Distance</div>
          <div class="card-body">
            <div id="distanceValue" class="distance-value">—</div>
            <div class="distance-unit">cm</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Lighting level</div>
          <div class="card-body">
            <div id="lightValue" class="distance-value">—</div>
            <div class="distance-unit">units</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Temperature</div>
          <div class="card-body">
            <div id="temperatureValue" class="distance-value">—</div>
            <div class="distance-unit">°C</div>
          </div>
        </div>
      </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const distanceValueEl = document.getElementById("distanceValue");
    const lightValueEl = document.getElementById("lightValue");
    const temperatureValueEl = document.getElementById("temperatureValue");
    const statusEl = document.getElementById("status");
    const notificationEl = document.getElementById("notification");
    let ws = null;
    let reconnectTimer = null;

    function showNotification(message, type = "error") {
      notificationEl.textContent = message;
      notificationEl.className = `notification show ${type}`;
      setTimeout(() => notificationEl.classList.remove("show"), 3000);
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
    }

    function setDistance(cm) {
      distanceValueEl.textContent = Number(cm).toFixed(1);
    }

    function setLight(level) {
      lightValueEl.textContent = String(Math.round(level));
    }

    function setTemperature(c) {
      temperatureValueEl.textContent = Number(c).toFixed(1);
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.serial_connected);
        if (data.last_distance_cm != null) {
          setDistance(data.last_distance_cm);
        }
        if (data.last_light_level != null) {
          setLight(data.last_light_level);
        }
        if (data.last_temperature_c != null) {
          setTemperature(data.last_temperature_c);
        }
      } catch {
        setStatus(false);
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "serial_status") {
            const wasOffline = statusEl.classList.contains("offline");
            setStatus(data.connected);
            if (data.connected && wasOffline) {
              showNotification("Arduino reconnected", "success");
            }
            return;
          }
          if (data.type === "distance" && data.cm != null) {
            setDistance(data.cm);
          }
          if (data.type === "light" && data.level != null) {
            setLight(data.level);
          }
          if (data.type === "temperature" && data.c != null) {
            setTemperature(data.c);
          }
        } catch {
          showNotification("Invalid message from server");
        }
      };

      ws.onclose = () => {
        setStatus(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
        showNotification("Connection error");
      };
    }

    connect();
    pollStatus();
    setInterval(pollStatus, 3000);
  </script>
</body>
</html>
