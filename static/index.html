<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Keypad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #4ade80;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow: auto;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 1.25rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .card-wide {
      grid-column: span 1;
    }

    @media (min-width: 720px) {
      .card-wide { grid-column: span 2; max-width: 480px; }
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .card-body {
      padding: 1.25rem 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .last-key {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      color: #e94560;
      text-align: center;
    }

    .last-key.empty { color: #444; }

    .history {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #3a3a42;
      background: #1a1a20;
    }

    .history li {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #2e2e34;
      font-size: 1rem;
      font-family: "Consolas", monospace;
    }

    .history li:last-child { border-bottom: none; }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/" class="active">Keypad</a>
        <a href="/sensors">Sensors</a>
        <a href="/digital">Digital Signal</a>
        <a href="/valves">Valves</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
      <h1 class="page-title">Keypad Live</h1>

      <div class="dashboard">
        <div class="card">
          <div class="card-header">Last Key</div>
          <div class="card-body">
            <div id="lastKey" class="last-key empty">—</div>
          </div>
        </div>

        <div class="card card-wide">
          <div class="card-header">Recent Keys</div>
          <div class="card-body" style="padding: 0;">
            <ul id="history" class="history"></ul>
          </div>
        </div>
      </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const MAX_HISTORY = 50;
    const lastKeyEl = document.getElementById("lastKey");
    const historyEl = document.getElementById("history");
    const statusEl = document.getElementById("status");
    const notificationEl = document.getElementById("notification");
    let ws = null;
    let reconnectTimer = null;
    let arduinoOnline = false;
    let serialStatusKnown = false;

    function showNotification(message, type = "error") {
      notificationEl.textContent = message;
      notificationEl.className = `notification show ${type}`;
      setTimeout(() => notificationEl.classList.remove("show"), 3000);
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
      arduinoOnline = connected;
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.serial_connected);
      } catch {
        setStatus(false);
      }
    }

    function appendKey(key) {
      lastKeyEl.textContent = key;
      lastKeyEl.classList.remove("empty");

      const li = document.createElement("li");
      li.textContent = key;
      historyEl.insertBefore(li, historyEl.firstChild);

      while (historyEl.children.length > MAX_HISTORY) {
        historyEl.removeChild(historyEl.lastChild);
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "serial_status") {
            const wasOnline = arduinoOnline;
            setStatus(data.connected);
            if (serialStatusKnown && data.connected && !wasOnline) {
              showNotification("Arduino reconnected", "success");
            }
            serialStatusKnown = true;
            return;
          }
          if (data.key) appendKey(data.key);
        } catch {
          showNotification("Invalid message from server");
        }
      };

      ws.onclose = () => {
        setStatus(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
        showNotification("Connection error");
      };
    }

    connect();
    pollStatus();
    setInterval(pollStatus, 3000);
  </script>
</body>
</html>
