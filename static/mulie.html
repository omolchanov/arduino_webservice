<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulie Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #38bdf8;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow: auto;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 1.25rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .sensor-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 0.4rem;
      vertical-align: middle;
      border-radius: 50%;
      background: #888;
    }

    .sensor-status-dot.ok { background: #4ade80; }
    .sensor-status-dot.error { background: #f87171; }

    .card-body {
      padding: 1.25rem 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-body-value {
      justify-content: center;
      align-items: center;
    }

    .display-value {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.15em;
    }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/">Keypad</a>
        <a href="/sensors">Sensors</a>
        <a href="/digital">Digital Signal</a>
        <a href="/valves">Valves</a>
        <a href="/mulie" class="active">Mulie Board</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
        <h1 class="page-title">Mulie Board</h1>

        <div class="dashboard">
          <div class="card">
            <div class="card-header">
              Live value from board <span id="displayDot" class="sensor-status-dot" aria-hidden="true"></span>
            </div>
            <div class="card-body card-body-value">
              <div id="displayValue" class="display-value">000</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const SENSOR_PENDING_MS = 10000;

    const displayValueEl = document.getElementById("displayValue");
    const displayDotEl = document.getElementById("displayDot");
    const statusEl = document.getElementById("status");
    const notificationEl = document.getElementById("notification");

    let ws = null;
    let reconnectTimer = null;
    let arduinoOnline = false;
    let serialStatusKnown = false;
    let displayDotState = "initializing";
    let displayInitTimeoutId = null;

    function formatDisplay(value) {
      return String(value).padStart(3, "0");
    }

    function showNotification(message, type = "error") {
      notificationEl.textContent = message;
      notificationEl.className = `notification show ${type}`;
      setTimeout(() => notificationEl.classList.remove("show"), 3000);
    }

    function setDisplayDot(state) {
      displayDotState = state;
      displayDotEl.className = `sensor-status-dot ${state}`;
    }

    function clearDisplayInitTimeout() {
      if (displayInitTimeoutId) {
        clearTimeout(displayInitTimeoutId);
        displayInitTimeoutId = null;
      }
    }

    function startDisplayInitTimeout() {
      clearDisplayInitTimeout();
      displayInitTimeoutId = setTimeout(() => {
        if (arduinoOnline && displayDotState === "initializing") {
          setDisplayDot("error");
        }
      }, SENSOR_PENDING_MS);
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
      if (connected === arduinoOnline) return;
      arduinoOnline = connected;
      if (connected) {
        setDisplayDot("initializing");
        startDisplayInitTimeout();
      } else {
        clearDisplayInitTimeout();
        setDisplayDot("error");
      }
    }

    function setDisplayValue(value, live) {
      displayValueEl.textContent = formatDisplay(value);
      if (!arduinoOnline || !live) return;
      clearDisplayInitTimeout();
      setDisplayDot("ok");
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        setStatus(data.serial_connected);
        if (data.display_value != null) {
          setDisplayValue(data.display_value, false);
        }
      } catch {
        setStatus(false);
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "serial_status") {
            const wasOnline = arduinoOnline;
            setStatus(data.connected);
            if (serialStatusKnown && data.connected && !wasOnline) {
              showNotification("Arduino reconnected", "success");
            }
            serialStatusKnown = true;
            return;
          }
          if (data.type === "display" && data.value != null) {
            setDisplayValue(Number(data.value), !data.cached);
          }
        } catch {
          showNotification("Invalid message from server");
        }
      };

      ws.onclose = () => {
        setStatus(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
        showNotification("Connection error");
      };
    }

    connect();
    pollStatus();
    setInterval(pollStatus, 3000);
  </script>
</body>
</html>
