<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Multiplexor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #1b1b1f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #16161a;
      border-right: 1px solid #3a3a42;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
    }

    nav a:hover {
      color: #fff;
      background: #252528;
      border-color: #3a3a42;
    }

    nav a.active {
      color: #fff;
      background: #2a2a30;
      border-color: #4a4a55;
      border-left: 3px solid #34d399;
      padding-left: calc(0.75rem - 2px);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .app-status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid #3a3a42;
    }

    .app-status.online {
      color: #4ade80;
      border-color: #2d5a40;
      background: #1a2e22;
    }

    .app-status.offline {
      color: #f87171;
      border-color: #5a2d2d;
      background: #2e1a1a;
    }

    .content {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow: auto;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 1.25rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .value-widgets-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .value-widgets-row .card {
      min-width: 0;
    }

    .card {
      background: #222228;
      border: 1px solid #3a3a42;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .card-wide {
      grid-column: 1 / -1;
    }

    .card-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid #3a3a42;
      background: #1c1c22;
    }

    .sensor-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 0.4rem;
      vertical-align: middle;
      border-radius: 50%;
      background: #888;
    }

    .sensor-status-dot.ok { background: #4ade80; }
    .sensor-status-dot.error { background: #f87171; }

    .card-body {
      padding: 1.25rem 0.85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-body-value {
      justify-content: center;
      align-items: center;
    }

    .address-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #a78bfa;
    }

    .input-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #60a5fa;
    }

    .output-value {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: #34d399;
    }

    .distance-unit {
      font-size: 1rem;
      color: #888;
      margin-top: 0.5rem;
    }

    .truth-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .truth-table th,
    .truth-table td {
      padding: 0.65rem 1rem;
      text-align: center;
      border: 1px solid #3a3a42;
    }

    .truth-table th {
      background: #1c1c22;
      color: #aaa;
      font-weight: 600;
    }

    .truth-table td {
      color: #e8e8e8;
    }

    .truth-table tr.active td {
      background: #1a2e28;
      color: #34d399;
    }

    .notification {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .notification.show { opacity: 1; }
    .notification.error { background: #2e1a1a; color: #fca5a5; border-color: #5a2d2d; }
    .notification.success { background: #1a2e22; color: #86efac; border-color: #2d5a40; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="/">Keypad</a>
        <a href="/sensors">Sensors</a>
        <a href="/digital">Digital Signal</a>
        <a href="/valves">Valves</a>
        <a href="/display">Display</a>
        <a href="/multiplexor" class="active">Multiplexor</a>
        <a href="/demultiplexor">Demultiplexor</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <span id="status" class="app-status offline">Offline</span>
      </header>

      <main class="content">
        <h1 class="page-title">Multiplexor</h1>

        <div class="dashboard">
          <div class="value-widgets-row">
            <div class="card">
              <div class="card-header">
                Address A <span id="addressDot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="addressValue" class="address-value">—</div>
                <div class="distance-unit">D4</div>
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                Data input DI0 <span id="di0Dot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="di0Value" class="input-value">—</div>
                <div class="distance-unit">D2</div>
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                Data input DI1 <span id="di1Dot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="di1Value" class="input-value">—</div>
                <div class="distance-unit">D3</div>
              </div>
            </div>
            <div class="card">
              <div class="card-header">
                Output DO <span id="outputDot" class="sensor-status-dot" aria-hidden="true"></span>
              </div>
              <div class="card-body card-body-value">
                <div id="outputValue" class="output-value">—</div>
                <div class="distance-unit">D13</div>
              </div>
            </div>
          </div>

          <div class="card card-wide">
            <div class="card-header">Multiplexor truth table</div>
            <div class="card-body">
              <table class="truth-table">
                <thead>
                  <tr>
                    <th>A</th>
                    <th>DI0</th>
                    <th>DI1</th>
                    <th>DO</th>
                  </tr>
                </thead>
                <tbody id="truthTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    const SENSOR_PENDING_MS = 10000;
    const MUX_TRUTH_TABLE = [
      [0, 0, null, 0],
      [0, 1, null, 1],
      [1, null, 0, 0],
      [1, null, 1, 1],
    ];

    const addressValueEl = document.getElementById("addressValue");
    const di0ValueEl = document.getElementById("di0Value");
    const di1ValueEl = document.getElementById("di1Value");
    const outputValueEl = document.getElementById("outputValue");
    const truthTableBodyEl = document.getElementById("truthTableBody");
    const statusEl = document.getElementById("status");

    const widgets = {
      address: {
        dotState: "initializing",
        dotEl: document.getElementById("addressDot"),
        initTimeoutId: null,
      },
      di0: {
        dotState: "initializing",
        dotEl: document.getElementById("di0Dot"),
        initTimeoutId: null,
      },
      di1: {
        dotState: "initializing",
        dotEl: document.getElementById("di1Dot"),
        initTimeoutId: null,
      },
      output: {
        dotState: "initializing",
        dotEl: document.getElementById("outputDot"),
        initTimeoutId: null,
      },
    };

    let ws = null;
    let reconnectTimer = null;
    let arduinoOnline = false;
    let serialStatusKnown = false;
    let currentA = null;
    let currentDi0 = null;
    let currentDi1 = null;

    function setWidgetDot(widgetId, state) {
      widgets[widgetId].dotState = state;
      widgets[widgetId].dotEl.className = `sensor-status-dot ${state}`;
    }

    function clearWidgetInitTimeout(widgetId) {
      const widget = widgets[widgetId];
      if (widget.initTimeoutId) {
        clearTimeout(widget.initTimeoutId);
        widget.initTimeoutId = null;
      }
    }

    function startWidgetInitTimeouts() {
      for (const [id, widget] of Object.entries(widgets)) {
        if (widget.dotState !== "initializing") continue;
        clearWidgetInitTimeout(id);
        widget.initTimeoutId = setTimeout(() => {
          if (arduinoOnline && widget.dotState === "initializing") {
            setWidgetDot(id, "error");
          }
        }, SENSOR_PENDING_MS);
      }
    }

    function applyWidgetReading(widgetId, live) {
      if (!arduinoOnline || !live) return;
      clearWidgetInitTimeout(widgetId);
      setWidgetDot(widgetId, "ok");
    }

    function onWidgetsOffline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetInitTimeout(id);
        setWidgetDot(id, "error");
      }
    }

    function onWidgetsOnline() {
      for (const id of Object.keys(widgets)) {
        clearWidgetInitTimeout(id);
        setWidgetDot(id, "initializing");
      }
      startWidgetInitTimeouts();
    }

    function setStatus(connected) {
      statusEl.textContent = connected ? "Online" : "Offline";
      statusEl.className = `app-status ${connected ? "online" : "offline"}`;
      if (connected === arduinoOnline) return;
      arduinoOnline = connected;
      if (connected) {
        onWidgetsOnline();
      } else {
        onWidgetsOffline();
      }
    }

    function formatCell(value) {
      return value === null ? "X" : value;
    }

    function renderTruthTable() {
      truthTableBodyEl.innerHTML = MUX_TRUTH_TABLE
        .map(([a, di0, di1, doVal]) => {
          const active =
            currentA !== null &&
            currentDi0 !== null &&
            currentDi1 !== null &&
            a === currentA &&
            (a === 0
              ? di0 === currentDi0
              : di1 === currentDi1);
          return `<tr class="${active ? "active" : ""}"><td>${a}</td><td>${formatCell(di0)}</td><td>${formatCell(di1)}</td><td>${doVal}</td></tr>`;
        })
        .join("");
    }

    function applyMux(data, live) {
      currentA = data.a;
      currentDi0 = data.di0;
      currentDi1 = data.di1;
      addressValueEl.textContent = String(data.a);
      di0ValueEl.textContent = String(data.di0);
      di1ValueEl.textContent = String(data.di1);
      outputValueEl.textContent = String(data.do);
      renderTruthTable();
      applyWidgetReading("address", live);
      applyWidgetReading("di0", live);
      applyWidgetReading("di1", live);
      applyWidgetReading("output", live);
    }

    async function pollStatus() {
      try {
        const response = await fetch("/api/status");
        if (!response.ok) return;
        const data = await response.json();
        if (!serialStatusKnown) {
          serialStatusKnown = true;
          setStatus(data.serial_connected);
        }
        if (
          data.last_mux_a !== null &&
          data.last_mux_di0 !== null &&
          data.last_mux_di1 !== null &&
          data.last_mux_do !== null
        ) {
          applyMux(
            {
              a: data.last_mux_a,
              di0: data.last_mux_di0,
              di1: data.last_mux_di1,
              do: data.last_mux_do,
            },
            false
          );
        }
      } catch {
        if (!serialStatusKnown) {
          serialStatusKnown = true;
          setStatus(false);
        }
      }
    }

    function connectWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      };

      ws.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }
        if (data.type === "serial_status") {
          serialStatusKnown = true;
          setStatus(data.connected);
          return;
        }
        if (data.type === "mux") {
          applyMux(data, !data.cached);
        }
      };

      ws.onclose = () => {
        ws = null;
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(connectWebSocket, 2000);
        }
      };
    }

    renderTruthTable();
    pollStatus();
    setInterval(pollStatus, 3000);
    connectWebSocket();
  </script>
</body>
</html>
